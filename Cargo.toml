[package]
name = "trt"
version = "0.0.0"
edition = "2024"
authors = ["Alejandro Vaz <alejandro.vaz.myt@gmail.com>"]
default-run = "trt"
repository = "https://github.com/trtlang/trt"
categories = [
  "development-tools",
  "parser-implementations",
  "parsing",
  "algorithms",
]
keywords = ["programming language", "compiler", "trt", "language"]
description = "the TRT language"
exclude = [".github/", ".gitignore"]
license = "MIT"
publish = false

[lints.rust]
unused = "deny"
deprecated = "deny"
unreachable_code = "deny"
nonstandard_style = "deny"
warnings = "deny"
missing_debug_implementations = "deny"
dropping_copy_types = "deny"
dropping_references = "deny"
elided_lifetimes_in_paths = "deny"
explicit_builtin_cfgs_in_flags = "deny"
forgetting_copy_types = "deny"
forgetting_references = "deny"
impl_trait_redundant_captures = "deny"
invalid_doc_attributes = "deny"
irrefutable_let_patterns = "deny"
macro_use_extern_crate = "deny"
missing_copy_implementations = "deny"
mutable_transmutes = "deny"
noop_method_call = "deny"
opaque_hidden_inferred_bound = "deny"
overflowing_literals = "deny"
redundant_imports = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
unknown_lints = "deny"
arithmetic_overflow = "deny"
missing_docs = "deny"
type_alias_bounds = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"

[[bin]]
name = "trt"
path = "./main.rs"

[profile.release]
lto = "fat"
opt-level = 3
strip = true
debug = false
codegen-units = 1
incremental = false

[dependencies]
anyhow = { version = "1", default-features = false }
clap = { version = "4", default-features = false, features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "string",
  "suggestions",
  "usage",
  "wrap_help",
] }
serde = { version = "1", default-features = false, features = ["derive"] }
toml = { version = "1", features = [
  "fast_hash",
  "parse",
  "preserve_order",
  "serde",
], default-features = false }

[build-dependencies]
anyhow = { version = "1", default-features = false }
built = { version = "0.8", features = [
  "cargo-lock",
  "chrono",
  "dependency-tree",
  "gix",
  "semver",
] }
