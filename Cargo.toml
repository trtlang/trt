[package]
name = "trt"
version = "0.0.0"
edition = "2024"
authors = ["Alejandro Vaz <alejandro.vaz.myt@gmail.com>"]
default-run = "trt"
repository = "https://github.com/trtlang/trt"
categories = [
  "development-tools",
  "parser-implementations",
  "parsing",
  "algorithms",
]
keywords = ["programming language", "compiler", "trt", "language"]
description = "the TRT language"
exclude = [".github/", ".gitignore"]
license = "MIT"
publish = false

[[bin]]
name = "trt"
path = "./main.rs"

[profile.release]
lto = "fat"
opt-level = 3
strip = true
debug = false
debug-assertions = false
codegen-units = 1

[dependencies]
anyhow = { version = "1", default-features = false }
clap = { version = "4", default-features = false, features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "string",
  "suggestions",
  "usage",
  "wrap_help",
] }
serde = { version = "1", default-features = false, features = ["derive"] }
toml = { version = "1", features = [
  "fast_hash",
  "parse",
  "preserve_order",
  "serde",
], default-features = false }
