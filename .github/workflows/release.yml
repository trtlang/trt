name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'trtlang/trt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: trt-install-${{ inputs.version }}
          path: ./install.sh
  macos:
    if: github.repository == 'trtlang/trt'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build
      - uses: actions/upload-artifact@v7
        with:
          name: trt-macos-${{ inputs.version }}
          path: target/release/trt
  release:
    needs: [install, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git tag ${{ inputs.version }}
      - run: git push origin ${{ inputs.version }}
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: downloads/*
